# Home Assistant app configuration (HA called apps "add-ons" before 2026.2).
# Reference: https://developers.home-assistant.io/docs/apps/configuration/
name: Homestead Finance
version: "0.1.0"
slug: homestead_finance
description: Farm finance and records for homesteads. Early test version, not for real records yet.
url: https://github.com/ITredneck/Homestead_farming_finance
stage: experimental
arch:
  - aarch64
  - amd64
# Prebuilt multi-arch image on GHCR; the tag is always `version` above.
image: ghcr.io/itredneck/homestead-finance
# The HA base image runs s6-overlay as process 1.
init: false

ingress: true
panel_icon: mdi:barn
panel_title: Homestead Finance
# Every Home Assistant user can use the app, not only administrators.
panel_admin: false

homeassistant_api: true
map:
  # Temporary receipt copies for HA AI Task (from M4).
  - type: media
    read_only: false

# Stop the app while its folder is backed up, so the SQLite database is always
# consistent in backups (see issue #13).
backup: cold
# Health is checked by the image's own Docker HEALTHCHECK (see docker/Dockerfile).

options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
