name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Generated API client is up to date
        run: |
          pnpm gen:api
          if ! git diff --exit-code -- src/api/generated; then
            echo "::error::The typed API client is out of date. Run 'pnpm gen:api' in frontend/ and commit the result."
            exit 1
          fi

  e2e:
    name: End-to-end (fake ingress)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  layout:
    name: Repository layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Only homestead_finance/ may contain config.yaml, config.yml or config.json
        # The Supervisor reads any file with these names, at any depth, as an app.
        run: |
          stray=$(git ls-files | grep -E '(^|/)config\.(ya?ml|json)$' | grep -v '^homestead_finance/config\.yaml$' || true)
          if [ -n "$stray" ]; then
            echo "::error::Rename or move these files: $stray"
            exit 1
          fi
